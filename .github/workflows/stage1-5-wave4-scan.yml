name: Stage 1.5 wave 4 figure scan

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - ".github/workflows/stage1-5-wave4-scan.yml"
      - "projects/scientific-figure-style-corpus/scripts/scan_stage1_5_wave4.py"
      - "projects/scientific-figure-style-corpus/manifests/stage1_5_wave4_candidates.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-5-wave4-scan-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r projects/scientific-figure-style-corpus/scripts/requirements.txt
          pip install pillow

      - name: Scan all wave 4 main-text figures
        run: |
          python projects/scientific-figure-style-corpus/scripts/scan_stage1_5_wave4.py \
            --project-root projects/scientific-figure-style-corpus \
            --candidates projects/scientific-figure-style-corpus/manifests/stage1_5_wave4_candidates.csv

      - name: Commit scan metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_scan/stage1_5_wave4_all_figures.csv \
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_scan/stage1_5_wave4_scan_summary.json
          if git diff --cached --quiet; then
            echo "No scan metadata changes"
          else
            git commit -m "Scan Stage 1.5 wave 4 figures"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload wave 4 visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage1-5-wave4-scan
          path: |
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_scan/stage1_5_wave4_all_figures.csv
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_scan/stage1_5_wave4_scan_summary.json
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_scan/previews
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_scan/contact_sheets
          if-no-files-found: error
