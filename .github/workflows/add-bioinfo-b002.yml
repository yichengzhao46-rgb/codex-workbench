name: Add bioinformatics reference B002

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - .github/workflows/add-bioinfo-b002.yml

permissions:
  contents: write

jobs:
  add-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figure-style-corpus-v0.1
          fetch-depth: 0

      - name: Download CC BY Figure 4 and update bioinformatics library
        shell: python
        run: |
          import csv
          import hashlib
          import pathlib
          import struct
          import urllib.request

          root = pathlib.Path('projects/bioinformatics-figure-reference-library')
          asset_rel = pathlib.Path('assets/B002/Guzman2019_NatCommun_Fig4.png')
          asset = root / asset_rel
          asset.parent.mkdir(parents=True, exist_ok=True)

          urls = [
              'https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs41467-019-09377-6/MediaObjects/41467_2019_9377_Fig4_HTML.png',
              'https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41467-019-09377-6/MediaObjects/41467_2019_9377_Fig4_HTML.png',
          ]
          last = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                  if data[:8] == b'\x89PNG\r\n\x1a\n' and len(data) > 10000:
                      asset.write_bytes(data)
                      source_url = url
                      break
              except Exception as e:
                  last = e
          else:
              raise RuntimeError(f'Could not download Fig. 4: {last}')

          data = asset.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          width, height = struct.unpack('>II', data[16:24])

          manifest = root / 'manifest.csv'
          with manifest.open(newline='', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          rows = [r for r in rows if r['id'] != 'B002']
          rows.append({
              'id': 'B002',
              'source_group': 'CCBY',
              'asset_path': asset_rel.as_posix(),
              'origin_library': 'Nature Communications',
              'origin_asset_path': source_url,
              'selection_role': 'bioinformatics_analysis_visual_reference',
              'size_bytes': str(len(data)),
              'sha256': sha,
          })
          with manifest.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)

          prov = root / 'open-access-references.csv'
          pfields = ['id','journal','year','article_title','doi','figure_id','article_url','license','license_url','primary_purpose','style_family','layout','information_density','asset_path','sha256','dimensions','selection_note']
          prows = []
          if prov.exists():
              with prov.open(newline='', encoding='utf-8-sig') as f:
                  prows = list(csv.DictReader(f))
          prows = [r for r in prows if r.get('id') != 'B002']
          prows.append({
              'id':'B002','journal':'Nature Communications','year':'2019',
              'article_title':'Phototrophic extracellular electron uptake is linked to carbon dioxide fixation in the bacterium Rhodopseudomonas palustris',
              'doi':'10.1038/s41467-019-09377-6','figure_id':'Figure 4',
              'article_url':'https://www.nature.com/articles/s41467-019-09377-6',
              'license':'CC BY 4.0','license_url':'https://creativecommons.org/licenses/by/4.0/',
              'primary_purpose':'metabolic_pathway','style_family':'pathway_cutaway_2d',
              'layout':'evidence_to_model','information_density':'high',
              'asset_path':asset_rel.as_posix(),'sha256':sha,'dimensions':f'{width}x{height}',
              'selection_note':'User selected Figure 4 for the bioinformatics figure reference library on 2026-09-14. Strong reference for integrating CBB-cycle gene-expression tiles, isotope-validation bar plots, and differential-expression heatmaps in one evidence-linked panel.'
          })
          with prov.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=pfields)
              w.writeheader(); w.writerows(prows)

          readme = root / 'README.md'
          txt = readme.read_text(encoding='utf-8')
          txt = txt.replace('- 14 references total', '- 15 references total')
          txt = txt.replace('- 13 locally mirrored assets', '- 14 locally mirrored assets')
          if 'B002' not in txt:
              txt += '\n\nAdditional open-access local reference: `B002` — Guzman et al., Nature Communications (2019), Figure 4, DOI `10.1038/s41467-019-09377-6`, CC BY 4.0.\n'
          readme.write_text(txt, encoding='utf-8')

          report = root / 'B002-ingest-report.txt'
          report.write_text(f'B002\nsha256={sha}\nsize_bytes={len(data)}\ndimensions={width}x{height}\nsource={source_url}\nlicense=CC BY 4.0\n', encoding='utf-8')

      - name: Commit B002
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/bioinformatics-figure-reference-library
          git diff --cached --quiet && exit 0
          git commit -m "Add B002 RP EEU carbon-fixation bioinformatics reference"
          git push origin HEAD:feat/figure-style-corpus-v0.1
