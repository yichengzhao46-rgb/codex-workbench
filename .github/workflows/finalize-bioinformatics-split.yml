name: Finalize bioinformatics figure split

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - .github/workflows/finalize-bioinformatics-split.yml
      - projects/bioinformatics-figure-reference-library/final_split.csv
      - projects/bioinformatics-figure-reference-library/finalize_split.py

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figure-style-corpus-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize split
        run: python projects/bioinformatics-figure-reference-library/finalize_split.py
      - name: Commit results
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A projects/scientific-figure-style-corpus projects/bioinformatics-figure-reference-library
          git commit -m "Finalize bioinformatics figure split"
          git push origin HEAD:feat/figure-style-corpus-v0.1
