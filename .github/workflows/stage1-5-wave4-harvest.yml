name: Stage 1.5 wave 4 screened harvest

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - ".github/workflows/stage1-5-wave4-harvest.yml"
      - "projects/scientific-figure-style-corpus/scripts/harvest_stage1_5_wave4.py"
      - "projects/scientific-figure-style-corpus/annotations/stage1_5_wave4_figure_screening.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-5-wave4-harvest-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Harvest Wave 4 selected assets
        run: |
          python projects/scientific-figure-style-corpus/scripts/harvest_stage1_5_wave4.py \
            --project-root projects/scientific-figure-style-corpus \
            --selection projects/scientific-figure-style-corpus/annotations/stage1_5_wave4_figure_screening.csv
      - name: Checksum and manifest validation
        run: |
          python - <<'PY'
          import csv,hashlib,json,pathlib
          root=pathlib.Path('projects/scientific-figure-style-corpus')
          rows=list(csv.DictReader((root/'manifests/stage1_5_wave4_harvested_figures.csv').open(encoding='utf-8',newline='')))
          for r in rows:
              p=root/r['asset_path']
              if not p.exists(): raise SystemExit(f'missing asset: {p}')
              if hashlib.sha256(p.read_bytes()).hexdigest()!=r['sha256']: raise SystemExit(f'checksum mismatch: {p}')
          hashes=[r['sha256'] for r in rows]
          if len(hashes)!=len(set(hashes)): raise SystemExit('duplicate SHA-256 detected')
          v=json.loads((root/'validation/stage1_5_wave4_final_validation.json').read_text())
          if not v.get('validation_passed'): raise SystemExit('final validation flag is false')
          print(f'validated {len(rows)} wave4 assets')
          PY
      - name: Commit Wave 4 assets and validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/scientific-figure-style-corpus/assets/stage1_5 \
            projects/scientific-figure-style-corpus/manifests/stage1_5_wave4_harvested_figures.csv \
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_harvest_report.json \
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_final_validation.json \
            projects/scientific-figure-style-corpus/validation/stage1_5_status.json
          if git diff --cached --quiet; then
            echo "No Wave 4 harvest changes"
          else
            git commit -m "Harvest and validate Stage 1.5 wave 4 figures"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload validated Wave 4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage1-5-wave4-harvest
          path: |
            projects/scientific-figure-style-corpus/assets/stage1_5
            projects/scientific-figure-style-corpus/manifests/stage1_5_wave4_harvested_figures.csv
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_harvest_report.json
            projects/scientific-figure-style-corpus/validation/stage1_5_wave4_final_validation.json
            projects/scientific-figure-style-corpus/validation/stage1_5_status.json
          if-no-files-found: error
