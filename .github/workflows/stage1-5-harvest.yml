name: Stage 1.5 targeted figure harvest

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - ".github/workflows/stage1-5-harvest.yml"
      - "projects/scientific-figure-style-corpus/scripts/harvest_stage1_5.py"
      - "projects/scientific-figure-style-corpus/annotations/stage1_5_wave1_figure_screening.csv"
  workflow_dispatch:

concurrency:
  group: stage1-5-harvest-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Harvest screened public figures
        run: |
          python projects/scientific-figure-style-corpus/scripts/harvest_stage1_5.py \
            --project-root projects/scientific-figure-style-corpus \
            --selection projects/scientific-figure-style-corpus/annotations/stage1_5_wave1_figure_screening.csv

      - name: Validate harvested assets
        run: |
          python - <<'PY'
          import csv, hashlib, json, pathlib
          root = pathlib.Path('projects/scientific-figure-style-corpus')
          manifest = root / 'manifests/stage1_5_harvested_figures.csv'
          rows = list(csv.DictReader(manifest.open(encoding='utf-8', newline='')))
          if not rows:
              raise SystemExit('no Stage 1.5 assets harvested')
          for row in rows:
              p = root / row['asset_path']
              if not p.exists():
                  raise SystemExit(f'missing harvested asset: {p}')
              if hashlib.sha256(p.read_bytes()).hexdigest() != row['sha256']:
                  raise SystemExit(f'checksum mismatch: {p}')
          print(f'validated {len(rows)} Stage 1.5 assets')
          print((root / 'validation/stage1_5_status.json').read_text())
          PY

      - name: Commit Stage 1.5 assets and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/scientific-figure-style-corpus/assets/stage1_5 \
            projects/scientific-figure-style-corpus/manifests/stage1_5_harvested_figures.csv \
            projects/scientific-figure-style-corpus/validation/stage1_5_harvest_report.json \
            projects/scientific-figure-style-corpus/validation/stage1_5_status.json
          if git diff --cached --quiet; then
            echo "No Stage 1.5 harvest changes to commit"
          else
            git commit -m "Harvest Stage 1.5 screened scientific figures"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Stage 1.5 harvest artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage1-5-wave1-harvest
          path: |
            projects/scientific-figure-style-corpus/assets/stage1_5
            projects/scientific-figure-style-corpus/manifests/stage1_5_harvested_figures.csv
            projects/scientific-figure-style-corpus/validation/stage1_5_harvest_report.json
            projects/scientific-figure-style-corpus/validation/stage1_5_status.json
          if-no-files-found: error
