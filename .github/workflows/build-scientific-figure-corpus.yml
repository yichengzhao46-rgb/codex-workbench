name: Build scientific figure raw corpus

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - ".github/workflows/build-scientific-figure-corpus.yml"
      - "projects/scientific-figure-style-corpus/scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-scientific-figure-corpus.yml"
      - "projects/scientific-figure-style-corpus/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-corpus:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Build 100-image rights-aware raw corpus
        run: |
          python projects/scientific-figure-style-corpus/scripts/build_raw_corpus.py \
            --project-root projects/scientific-figure-style-corpus \
            --target-total 100 \
            --retmax 400 \
            --max-per-article 2 \
            --min-score 4

      - name: Validate image count and checksums
        run: |
          python - <<'PY'
          import csv, hashlib, pathlib
          root = pathlib.Path('projects/scientific-figure-style-corpus')
          manifest = root / 'manifests/raw-image-manifest.csv'
          rows = list(csv.DictReader(manifest.open(encoding='utf-8')))
          if len(rows) < 100:
              raise SystemExit(f'raw corpus incomplete: {len(rows)}/100 images')
          journals = {}
          core = 0
          scope_high = 0
          articles = set()
          for row in rows:
              journals[row['journal_slug']] = journals.get(row['journal_slug'], 0) + 1
              articles.add(row['pmcid'])
              if row.get('source_tier') == 'core':
                  core += 1
              elif row.get('source_tier') == 'scope-high':
                  scope_high += 1
              path = root / row['asset_path']
              if not path.exists():
                  raise SystemExit(f'missing asset: {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != row['sha256']:
                  raise SystemExit(f'checksum mismatch: {path}')
          if core < 50:
              raise SystemExit(f'core-journal representation too low: {core}/100')
          if len(articles) < 45:
              raise SystemExit(f'article diversity too low: {len(articles)} distinct articles')
          print('validated', len(rows), 'images', journals)
          print('core', core, 'scope-high', scope_high, 'distinct_articles', len(articles))
          PY

      - name: Commit generated corpus to branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/scientific-figure-style-corpus/assets/raw \
            projects/scientific-figure-style-corpus/manifests/raw-image-manifest.csv \
            projects/scientific-figure-style-corpus/validation/raw-corpus-build-report.json
          if git diff --cached --quiet; then
            echo "No corpus changes to commit"
          else
            git commit -m "Populate 100-image raw scientific figure corpus"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload corpus build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientific-figure-raw-corpus
          path: |
            projects/scientific-figure-style-corpus/assets/raw
            projects/scientific-figure-style-corpus/manifests/raw-image-manifest.csv
            projects/scientific-figure-style-corpus/validation/raw-corpus-build-report.json
          if-no-files-found: error