name: Build scientific figure raw corpus

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - ".github/workflows/build-scientific-figure-corpus.yml"
      - "projects/scientific-figure-style-corpus/scripts/**"
  workflow_dispatch:

concurrency:
  group: scientific-figure-corpus-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Find previous successful corpus artifact
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = 'build-scientific-figure-corpus.yml';
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              branch: context.ref.replace('refs/heads/', ''),
              status: 'completed',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId || run.conclusion !== 'success') continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.data.artifacts.find(a => a.name === 'scientific-figure-raw-corpus' && !a.expired);
              if (artifact) {
                core.setOutput('run_id', String(run.id));
                core.info(`Using prior successful corpus artifact from run ${run.id}`);
                return;
              }
            }
            core.setOutput('run_id', '');
            core.info('No previous successful corpus artifact found; build will start from zero.');

      - name: Download previous corpus artifact
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: scientific-figure-raw-corpus
          path: _previous_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Filter previous artifact into current-scope seed
        id: seed
        shell: bash
        run: |
          rm -rf _seed _increment
          mkdir -p _seed _increment
          if [ -d _previous_artifact ]; then
            python projects/scientific-figure-style-corpus/scripts/merge_seed_corpus.py seed \
              --artifact-root _previous_artifact \
              --output-root _seed
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, pathlib
          manifest = pathlib.Path('_seed/manifests/raw-image-manifest.csv')
          count = 0
          if manifest.exists():
              with manifest.open(encoding='utf-8', newline='') as f:
                  count = sum(1 for _ in csv.DictReader(f))
          print(f'seed_count={count}')
          print(f'remaining={max(0, 100-count)}')
          PY

      - name: Build only the remaining corpus gap
        if: steps.seed.outputs.remaining != '0'
        run: |
          python projects/scientific-figure-style-corpus/scripts/run_raw_corpus_scoped.py \
            --project-root _increment \
            --target-total ${{ steps.seed.outputs.remaining }} \
            --retmax 400 \
            --max-per-article 2 \
            --min-score 4

      - name: Merge seed and new images under current scope
        run: |
          mkdir -p _increment/manifests
          if [ ! -f _increment/manifests/raw-image-manifest.csv ]; then
            printf 'sample_id,journal,journal_slug,source_tier,year,article_title,doi,pmcid,figure_id,article_url,source_image_url,resolved_image_url,license,license_url,rights_status,third_party_review,caption_score,caption,asset_path,content_type,size_bytes,sha256,inspection_status\n' > _increment/manifests/raw-image-manifest.csv
          fi
          python projects/scientific-figure-style-corpus/scripts/merge_seed_corpus.py merge \
            --seed-root _seed \
            --increment-root _increment \
            --output-root projects/scientific-figure-style-corpus \
            --target 100

      - name: Validate image count, source scope, and checksums
        run: |
          python - <<'PY'
          import csv, hashlib, pathlib
          root = pathlib.Path('projects/scientific-figure-style-corpus')
          manifest = root / 'manifests/raw-image-manifest.csv'
          rows = list(csv.DictReader(manifest.open(encoding='utf-8')))
          if len(rows) < 100:
              raise SystemExit(f'raw corpus incomplete: {len(rows)}/100 images')
          excluded = {
              'est-letters', 'microbiome', 'mbio', 'npj-biofilms-microbiomes',
              'communications-biology', 'water-research-x', 'environmental-microbiome'
          }
          journals = {}
          core = 0
          articles = set()
          for row in rows:
              slug = row['journal_slug']
              if slug in excluded:
                  raise SystemExit(f'excluded journal entered corpus: {slug}')
              journals[slug] = journals.get(slug, 0) + 1
              articles.add(row['pmcid'])
              if row.get('source_tier') == 'core':
                  core += 1
              path = root / row['asset_path']
              if not path.exists():
                  raise SystemExit(f'missing asset: {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != row['sha256']:
                  raise SystemExit(f'checksum mismatch: {path}')
          if core < 50:
              raise SystemExit(f'core-journal representation too low: {core}/100')
          if len(articles) < 45:
              raise SystemExit(f'article diversity too low: {len(articles)} distinct articles')
          print('validated', len(rows), 'images', journals)
          print('core', core, 'distinct_articles', len(articles))
          PY

      - name: Commit generated corpus to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/scientific-figure-style-corpus/assets/raw \
            projects/scientific-figure-style-corpus/manifests/raw-image-manifest.csv \
            projects/scientific-figure-style-corpus/validation/raw-corpus-build-report.json \
            projects/scientific-figure-style-corpus/validation/raw-corpus-merge-report.json
          if git diff --cached --quiet; then
            echo "No corpus changes to commit"
          else
            git commit -m "Populate 100-image raw scientific figure corpus"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload corpus build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientific-figure-raw-corpus
          path: |
            projects/scientific-figure-style-corpus/assets/raw
            projects/scientific-figure-style-corpus/manifests/raw-image-manifest.csv
            projects/scientific-figure-style-corpus/validation/raw-corpus-build-report.json
            projects/scientific-figure-style-corpus/validation/raw-corpus-merge-report.json
          if-no-files-found: error
