name: Build scientific figure raw corpus

on:
  push:
    branches:
      - feat/figure-style-corpus-v0.1
    paths:
      - ".github/workflows/build-scientific-figure-corpus.yml"
      - "projects/scientific-figure-style-corpus/scripts/**"
      - "projects/scientific-figure-style-corpus/manifests/raw-image-manifest.csv"
      - "projects/scientific-figure-style-corpus/manifests/zotero-private-manifest.csv"
      - "projects/scientific-figure-style-corpus/manifests/stage1_5*_harvested_figures.csv"
      - "projects/scientific-figure-style-corpus/annotations/figure-level-classification-v0.1.csv"
      - "projects/scientific-figure-style-corpus/validation/router-retrieval-test-cases.json"
  workflow_dispatch:

concurrency:
  group: scientific-figure-corpus-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/scientific-figure-style-corpus/scripts/requirements.txt

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect verified committed checkpoint
        id: current
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import os
          import pathlib

          root = pathlib.Path('projects/scientific-figure-style-corpus')
          manifest = root / 'manifests/raw-image-manifest.csv'
          manifest_rows = 0
          valid = 0
          invalid = 0

          if manifest.exists():
              with manifest.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.DictReader(f))
              manifest_rows = len(rows)
              for row in rows:
                  rel = (row.get('asset_path') or '').strip()
                  expected = (row.get('sha256') or '').strip()
                  if not rel or not expected:
                      invalid += 1
                      continue
                  path = root / rel
                  if not path.exists() or not path.is_file():
                      invalid += 1
                      continue
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != expected:
                      invalid += 1
                      continue
                  valid += 1

          next_target = min(100, ((valid // 10) + 1) * 10) if valid < 100 else 100
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as out:
              out.write(f'count={valid}\n')
              out.write(f'next_target={next_target}\n')
              out.write(f'manifest_rows={manifest_rows}\n')
              out.write(f'invalid_rows={invalid}\n')

          print(f'Verified committed checkpoint: {valid}/100')
          print(f'Manifest rows present: {manifest_rows}; non-verified/placeholders: {invalid}')
          PY

      - name: Build and persist 10-image checkpoints
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=${{ steps.current.outputs.count }}
          echo "Starting from verified checkpoint: ${CURRENT}/100"
          if [ "$CURRENT" -ge 100 ]; then
            echo "Corpus already has $CURRENT verified images; skipping download batches."
            exit 0
          fi

          START=$(( (CURRENT / 10 + 1) * 10 ))
          for TARGET in $(seq "$START" 10 100); do
            echo "============================================================"
            echo "Checkpoint batch: verified=$CURRENT target=$TARGET/100"
            echo "============================================================"

            python projects/scientific-figure-style-corpus/scripts/build_raw_corpus_resume.py \
              --project-root projects/scientific-figure-style-corpus \
              --target-total "$TARGET" \
              --retmax 400 \
              --max-per-article 2 \
              --min-score 4

            python - "$TARGET" <<'PY'
          import csv, hashlib, pathlib, sys
          target = int(sys.argv[1])
          root = pathlib.Path('projects/scientific-figure-style-corpus')
          manifest = root / 'manifests/raw-image-manifest.csv'
          rows = list(csv.DictReader(manifest.open(encoding='utf-8', newline='')))
          valid = 0
          for row in rows:
              rel = (row.get('asset_path') or '').strip()
              expected = (row.get('sha256') or '').strip()
              if not rel or not expected:
                  continue
              path = root / rel
              if not path.exists() or not path.is_file():
                  raise SystemExit(f'missing checkpoint asset: {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f'checkpoint checksum mismatch: {path}')
              valid += 1
          if valid < target:
              raise SystemExit(f'checkpoint incomplete: {valid}/{target} verified assets')
          print(f'checkpoint validated: {valid}/{target}')
          PY

            git add \
              projects/scientific-figure-style-corpus/assets/raw \
              projects/scientific-figure-style-corpus/manifests/raw-image-manifest.csv \
              projects/scientific-figure-style-corpus/validation/raw-corpus-build-report.json \
              projects/scientific-figure-style-corpus/validation/raw-corpus-progress.json

            if git diff --cached --quiet; then
              echo "No new files at checkpoint $TARGET"
            else
              git commit -m "Checkpoint scientific figure corpus at ${TARGET} images"
              git push origin HEAD:${{ github.ref_name }}
            fi
            CURRENT=$TARGET
          done

      - name: Validate final 100-image corpus
        run: |
          python - <<'PY'
          import csv, hashlib, pathlib, json
          root = pathlib.Path('projects/scientific-figure-style-corpus')
          manifest = root / 'manifests/raw-image-manifest.csv'
          rows = list(csv.DictReader(manifest.open(encoding='utf-8', newline='')))
          valid_rows = []
          excluded = {
              'est-letters', 'microbiome', 'mbio', 'npj-biofilms-microbiomes',
              'communications-biology', 'water-research-x', 'environmental-microbiome'
          }
          journals = {}
          core = 0
          articles = set()
          hashes = set()
          figure_keys = set()
          for row in rows:
              rel = (row.get('asset_path') or '').strip()
              expected = (row.get('sha256') or '').strip()
              if not rel or not expected:
                  continue
              slug = row.get('journal_slug', '')
              if slug in excluded:
                  raise SystemExit(f'excluded journal entered corpus: {slug}')
              path = root / rel
              if not path.exists():
                  raise SystemExit(f'missing asset: {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f'checksum mismatch: {path}')
              if digest in hashes:
                  raise SystemExit(f'duplicate asset hash: {path}')
              hashes.add(digest)
              key = (row.get('pmcid',''), row.get('figure_id',''))
              if key in figure_keys:
                  raise SystemExit(f'duplicate figure record: {key}')
              figure_keys.add(key)
              valid_rows.append(row)
              journals[slug] = journals.get(slug, 0) + 1
              if row.get('pmcid'):
                  articles.add(row['pmcid'])
              if row.get('source_tier') == 'core':
                  core += 1

          if len(valid_rows) < 100:
              raise SystemExit(f'raw corpus incomplete: {len(valid_rows)}/100 verified images')
          if core < 50:
              raise SystemExit(f'core-journal representation too low: {core}/100')
          if len(articles) < 45:
              raise SystemExit(f'article diversity too low: {len(articles)} distinct articles')
          summary = {
              'validated_images': len(valid_rows),
              'journals': journals,
              'core_images': core,
              'distinct_articles': len(articles),
              'duplicate_hashes': 0,
              'duplicate_figure_records': 0,
          }
          out = root / 'validation' / 'raw-corpus-final-validation.json'
          out.write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Build unified library index
        run: |
          python projects/scientific-figure-style-corpus/scripts/unified_library.py \
            --project-root projects/scientific-figure-style-corpus \
            build

      - name: Validate unified library index and assets
        run: |
          python projects/scientific-figure-style-corpus/scripts/unified_library.py \
            --project-root projects/scientific-figure-style-corpus \
            validate \
            --check-assets \
            --strict-snapshot \
            --report projects/scientific-figure-style-corpus/validation/unified-library-validation.json

      - name: Validate Style Router retrieval against real figure tasks
        run: |
          python projects/scientific-figure-style-corpus/scripts/validate_router_retrieval.py \
            --project-root projects/scientific-figure-style-corpus \
            --cases projects/scientific-figure-style-corpus/validation/router-retrieval-test-cases.json \
            --report projects/scientific-figure-style-corpus/validation/router-retrieval-validation.json

      - name: Commit final validation and unified index
        run: |
          git add \
            projects/scientific-figure-style-corpus/validation/raw-corpus-final-validation.json \
            projects/scientific-figure-style-corpus/manifests/unified-library-index.csv \
            projects/scientific-figure-style-corpus/manifests/unified-library-summary.json \
            projects/scientific-figure-style-corpus/validation/unified-library-validation.json \
            projects/scientific-figure-style-corpus/validation/router-retrieval-validation.json
          if git diff --cached --quiet; then
            echo "No validation/index changes to commit"
          else
            git commit -m "Build and validate unified scientific figure library"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload final corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientific-figure-raw-corpus
          path: |
            projects/scientific-figure-style-corpus/assets/raw
            projects/scientific-figure-style-corpus/manifests/raw-image-manifest.csv
            projects/scientific-figure-style-corpus/manifests/unified-library-index.csv
            projects/scientific-figure-style-corpus/manifests/unified-library-summary.json
            projects/scientific-figure-style-corpus/validation/raw-corpus-build-report.json
            projects/scientific-figure-style-corpus/validation/raw-corpus-progress.json
            projects/scientific-figure-style-corpus/validation/raw-corpus-final-validation.json
            projects/scientific-figure-style-corpus/validation/unified-library-validation.json
            projects/scientific-figure-style-corpus/validation/router-retrieval-validation.json
          if-no-files-found: error
